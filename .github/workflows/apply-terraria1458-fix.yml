name: Apply Terraria 1.4.5.8 wire fixes

on:
  push:
    branches: ["agent/terraria1458-wire-fixes"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: agent/terraria1458-wire-fixes
          fetch-depth: 0

      - name: Apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .audit-fix.patch.gz.b64 | gzip --decompress > /tmp/terraria1458-wire-fixes.patch
          git apply --check /tmp/terraria1458-wire-fixes.patch
          git apply /tmp/terraria1458-wire-fixes.patch
          rm .audit-fix.patch.gz.b64 .github/workflows/apply-terraria1458-fix.yml
          git config user.name "Xekep"
          git config user.email "Xekep@users.noreply.github.com"
          git add -A
          git commit -m "Fix Terraria 1.4.5.8 packet wire compatibility"
          git push origin HEAD:agent/terraria1458-wire-fixes
