name: Manual build and deploy plugin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Build plugin
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/Multiplicity-artifact"
          rm -rf "$artifact"
          mkdir -p "$artifact"

          dotnet restore Multiplicity.Packets/Multiplicity.Packets.csproj
          dotnet build Multiplicity.Packets/Multiplicity.Packets.csproj --configuration Release --no-restore
          cp Multiplicity.Packets/bin/Release/net9.0/Multiplicity.Packets.dll "$artifact/"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Multiplicity
          path: ${{ runner.temp }}/Multiplicity-artifact
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: Multiplicity
          path: ${{ runner.temp }}\Multiplicity-artifact

      - name: Deploy artifact
        shell: pwsh
        env:
          DEPLOY_DIR: ${{ vars.PLUGIN_DEPLOY_DIR }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_DIR)) {
            $env:DEPLOY_DIR = "C:\github-deploy"
            Write-Host "PLUGIN_DEPLOY_DIR is not set. Using default: $env:DEPLOY_DIR"
          }

          $artifactDir = Join-Path $env:RUNNER_TEMP "Multiplicity-artifact"
          $dlls = @(Get-ChildItem -LiteralPath $artifactDir -Filter "*.dll" -File)
          if ($dlls.Count -ne 1) { throw "Expected exactly one plugin DLL in artifact, found $($dlls.Count)." }

          $source = $dlls[0].FullName
          $destination = Join-Path $env:DEPLOY_DIR $dlls[0].Name
          New-Item -ItemType Directory -Path $env:DEPLOY_DIR -Force | Out-Null

          if (-not (Test-Path $destination)) {
            Copy-Item $source $destination
          } else {
            $bytes = [System.IO.File]::ReadAllBytes($source)
            $stream = [System.IO.File]::Open($destination, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
            try {
              $stream.SetLength(0)
              $stream.Write($bytes, 0, $bytes.Length)
              $stream.Flush($true)
            } finally {
              $stream.Dispose()
            }
          }

          Write-Host "Deployed: $destination"
