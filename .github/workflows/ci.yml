name: CI

on:
  push:
    branches: ["general-devel"]
  pull_request:
    branches: ["general-devel"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 9 and .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            11.0.100

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore Multiplicity.sln

      - name: Build
        run: dotnet build Multiplicity.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Multiplicity.Packets.Tests/Multiplicity.Packets.Tests.csproj --configuration Release --no-build
