name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (for example 3.0.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: Show .NET SDK
        run: dotnet --info

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ -z "$version" ]]; then
            echo "Package version is empty" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Multiplicity.sln

      - name: Build
        run: dotnet build Multiplicity.sln -c Release --no-restore

      - name: Test
        run: dotnet test Multiplicity.Packets.Tests/Multiplicity.Packets.Tests.csproj -c Release --no-build

      - name: Pack NuGet package
        run: >
          dotnet pack Multiplicity.Packets/Multiplicity.Packets.csproj
          -c Release
          --no-build
          -o artifacts/nuget
          /p:PackageVersion=${{ steps.version.outputs.value }}

      - name: Stage Multiplicity DLL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/library
          cp Multiplicity.Packets/bin/Release/net11.0/Multiplicity.Packets.dll artifacts/library/

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error
          retention-days: 14

      - name: Upload library artifact
        uses: actions/upload-artifact@v6
        with:
          name: Multiplicity
          path: artifacts/library/Multiplicity.Packets.dll
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-preview.7.26381.103

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Kidlok

      - name: Push package
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate

      - name: Push symbols
        run: >
          dotnet nuget push "artifacts/*.snupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate

  deploy:
    needs: build
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Download library artifact
        uses: actions/download-artifact@v8
        with:
          name: Multiplicity
          path: ${{ runner.temp }}\Multiplicity-artifact

      - name: Deploy artifact
        shell: pwsh
        env:
          DEPLOY_DIR: ${{ vars.PLUGIN_DEPLOY_DIR }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_DIR)) {
            $env:DEPLOY_DIR = "C:\github-deploy"
            Write-Host "PLUGIN_DEPLOY_DIR is not set. Using default: $env:DEPLOY_DIR"
          }

          $artifactDir = Join-Path $env:RUNNER_TEMP "Multiplicity-artifact"
          $dlls = @(Get-ChildItem -LiteralPath $artifactDir -Filter "*.dll" -File)
          if ($dlls.Count -ne 1) { throw "Expected exactly one Multiplicity DLL in artifact, found $($dlls.Count)." }

          $source = $dlls[0].FullName
          $destination = Join-Path $env:DEPLOY_DIR $dlls[0].Name
          New-Item -ItemType Directory -Path $env:DEPLOY_DIR -Force | Out-Null

          if (-not (Test-Path $destination)) {
            Copy-Item $source $destination
          } else {
            $bytes = [System.IO.File]::ReadAllBytes($source)
            $stream = [System.IO.File]::Open($destination, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
            try {
              $stream.SetLength(0)
              $stream.Write($bytes, 0, $bytes.Length)
              $stream.Flush($true)
            } finally {
              $stream.Dispose()
            }
          }

          Write-Host "Deployed: $destination"
