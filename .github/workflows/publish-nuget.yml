name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (for example 2.6.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Multiplicity.sln

      - name: Build
        run: dotnet build Multiplicity.sln -c Release --no-restore

      - name: Test
        run: dotnet test Multiplicity.Packets.Tests/Multiplicity.Packets.Tests.csproj -c Release --no-build

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ -z "$version" ]]; then
            echo "Package version is empty" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack Multiplicity.Packets/Multiplicity.Packets.csproj
          -c Release
          --no-build
          -o artifacts
          /p:PackageVersion=${{ steps.version.outputs.value }}

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Kidlok

      - name: Push package
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate

      - name: Push symbols
        run: >
          dotnet nuget push "artifacts/*.snupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate
